# Version updates for the actions the workflows and the composite action use.
# Actions are pinned to commit SHAs with the version in a trailing comment;
# Dependabot updates both. Deno dependencies are pinned inline in the scripts
# and in deno.lock and are reviewed by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: ["dependencies", "type:task"]
