# Secret scan of the commits each push or pull request adds. Used when no
# checks workflow carries the scan (light grade). Scanning commits, not the
# tree, catches a secret a later commit removed; the pre-commit hook is the
# prevention, this run is the backstop, and a pushed secret must be revoked.
name: secrets

on:
  push:
    branches: ["**"]
  pull_request:

permissions: {}

# A pull request scans base..HEAD, which is cumulative, so a newer push may
# cancel the older run. A push scans only its own commits, so cancelling a
# push run would leave those commits unscanned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: secrets / scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install betterleaks
        env:
          VERSION: "1.9.0"
          # From checksums.txt of the release; bump both together.
          SHA256: "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7"
        run: |
          set -euo pipefail
          url="https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}/betterleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o "$RUNNER_TEMP/betterleaks.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/betterleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/betterleaks.tar.gz" -C "$HOME/.local/bin" betterleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan the added commits
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCED: ${{ github.event.forced }}
        # A pull request always has its base commit. A push that creates the
        # branch names no previous commit (all zeros), and one after a force
        # push may name a commit that no longer exists: then the whole history
        # is scanned.
        run: |
          set -euo pipefail
          if [[ "${EVENT}" == push ]] && { [[ "${BASE}" =~ ^0+$ ]] || [[ "${FORCED}" == true ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; }; then
            echo "No usable previous commit; scanning the whole history."
            betterleaks git . --no-banner --redact
          else
            betterleaks git . --no-banner --redact --log-opts="${BASE}..HEAD"
          fi
