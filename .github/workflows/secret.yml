# Secret scanning of the commits a push or a pull request adds, with
# betterleaks (`just secrets-commits`). It is its own workflow so that any
# change to it stands out in review and a ruleset can require `secrets / scan`
# beside `checks / gate`. Scanning commits, not the tree, catches a secret that
# a later commit removed. Locally, the pre-commit hook scans staged files and
# `just secrets` scans the working tree; this run is the backstop, not the
# prevention: the repository is public, so a pushed secret must be revoked.
name: secrets

on:
  push:
    branches: ["**"]
  pull_request:

permissions: {}

# A pull request scans base..HEAD, which is cumulative, so a newer push may
# cancel the older run. A push scans only its own commits, so cancelling a
# push run would leave those commits unscanned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: secrets / scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
        with:
          deno-cache: "false"
          pre-commit: "false"
          openspec: "false"
      - name: Scan the added commits
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCED: ${{ github.event.forced }}
        # A pull request always has its base commit. A push that creates the
        # branch names no previous commit (all zeros), and one after a force
        # push may name a commit that no longer exists: then the whole history
        # is scanned.
        run: |
          range="${BASE}..HEAD"
          if [[ "${EVENT}" == push ]] && { [[ "${BASE}" =~ ^0+$ ]] || [[ "${FORCED}" == true ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; }; then
            echo "No usable previous commit; scanning the whole history."
            range=""
          fi
          just secrets-commits "${range}"
