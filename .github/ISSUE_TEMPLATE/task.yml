name: Task
description: Harness, tooling, documentation, or maintenance work that changes no shipped behaviour.
labels: ["type:task", "area:harness"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is better once this is done.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Files or areas touched, and what is explicitly left out.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Commands that pass or facts that hold when the task is complete.
    validations:
      required: true
