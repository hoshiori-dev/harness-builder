name: Task
description: "Planned {{PROJECT_NAME}} work with an agreed outcome" # CONFIGURE: the project's name.
labels: ["type:task"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: The observable state of the project when this task is complete.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Everything the executor needs that lives outside this issue; link the module or page being imitated instead of describing it.
    validations:
      required: true
  - type: textarea
    id: direction
    attributes:
      label: Solution direction
      description: Architecture-level direction and the work breakdown, not line-by-line instructions.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Commands that pass or states that can be checked; never "improve X".
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Adjacent work this task must not absorb.
    validations:
      required: true
