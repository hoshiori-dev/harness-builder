# Keeps the OpenSpec state label of every pull request current: one of
# `spec:skipped`, `spec:pending`, `spec:approved`, `spec:archived`, or none
# (.agents/knowledge/spec-workflow.md, gate 1). scripts/sync_pr_labels.ts
# decides from the pull request's present state through the API and writes the
# difference; `just pr-labels <n>` prints the same decision without writing.
#
# This is the one workflow on pull_request_target: it runs main's copy of this
# file and of the script with a token that may label the pull request. That is
# safe only within these bounds: it never checks out, fetches, or runs anything
# of the pull request; what the pull request controls reaches the script as
# environment variables, never inside a run: line; the job alone holds
# contents: read and pull-requests: write; the token is set on the two steps
# that call gh and nowhere else; no third-party action but the pinned checkout
# and deno setup; five minutes per run.
name: pr-labels

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      number:
        description: The pull request to reconcile; a dispatch cannot approve.
        required: true
        type: string

permissions: {}

# One group per pull request, runs serialized and every event kept: a running
# run finishes, and `queue: max` holds the pending ones (up to 100) instead of
# replacing them, so the run for a `labeled spec:approved` event is never
# dropped behind a later label event. A record is written only by the run of
# the event it belongs to, so an approval is never bound to the wrong commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.number }}
  cancel-in-progress: false
  queue: max

jobs:
  label:
    name: labels / pr
    if: github.event_name == 'pull_request_target' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The default branch's newest commit, never the pull request and never a
      # stacked pull request's base branch: the code that runs with the write
      # token is always what main holds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # The step's own limit turns a hung script into a failed step so that the
      # last step still runs; the job limit alone would cancel without it.
      - name: Decide and write the labels
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          DISPATCH_NUMBER: ${{ inputs.number }}
        run: deno run --allow-read --allow-env --allow-run=gh scripts/sync_pr_labels.ts --apply
      # A script that could not start, or failed before its own error path,
      # may leave spec:approved where it is wrong; this takes it off. A label
      # that is not there is no failure.
      - name: "Remove spec:approved after a failure"
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_NUMBER: ${{ inputs.number }}
          REPO: ${{ github.repository }}
        run: |
          number="${PR_NUMBER:-${DISPATCH_NUMBER}}"
          [[ "${number}" =~ ^[0-9]+$ ]] || exit 0
          if ! output="$(gh api -X DELETE "repos/${REPO}/issues/${number}/labels/spec%3A%20approved" 2>&1)"; then
            case "${output}" in
              *"HTTP 404"*) echo "spec:approved was not on the pull request." ;;
              *) echo "${output}" >&2; exit 1 ;;
            esac
          fi
