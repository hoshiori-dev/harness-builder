# Applies the committed label file when a push to the default branch changes
# it, or on dispatch. It creates and updates labels and never deletes one.
# The job holds `issues: write`, so it never runs on a pull-request event,
# and the checkout names the default branch, so no fork or branch code runs
# with that token.
name: labels

on:
  push:
    branches: ["{{DEFAULT_BRANCH}}"] # CONFIGURE: the default branch.
    paths: [".github/labels.json"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: labels / sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Apply the label file
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_labels.py --file .github/labels.json --repo "${{ github.repository }}" --apply
