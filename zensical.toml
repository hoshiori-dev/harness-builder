# Documentation site (Zensical). Chinese only: Zensical has no native i18n
# today (.agents/knowledge/docs-site.md records the decision and the trigger to
# revisit it). Navigation lives in docs/.nav.yml (awesome-nav), not here.
[project]
site_url = "https://hoshiori-dev.github.io/harness-builder/"
site_name = "Harness Builder"
site_description = "为项目创建、改进、重构 agent harness 的 Agent Plugins 插件"
repo_url = "https://github.com/hoshiori-dev/harness-builder"
repo_name = "hoshiori-dev/harness-builder"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

[project.theme]
language = "zh"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统设置"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/hoshiori-dev/harness-builder"

[project.plugins.awesome-nav]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
