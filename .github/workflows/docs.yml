# Publishes the documentation site (Zensical, Chinese) to GitHub Pages on every
# push to main that touches the docs or their build. The build itself is
# verified on pull requests by `checks / docs`; this workflow only deploys.
# Pages must be set to "GitHub Actions" as its source
# (.agents/knowledge/github/platform-settings.md).
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "justfile"
      - ".github/workflows/docs.yml"
      - ".github/actions/setup-tools/action.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: docs / deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          deno-cache: "false"
          pre-commit: "false"
          openspec: "false"
          betterleaks: "false"
      - run: just docs-build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
