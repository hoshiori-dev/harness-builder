# Secret scan of the commits a pipeline adds, as .gitlab/ci/secret.yml,
# included from .gitlab-ci.yml. Scanning commits, not the tree, catches a
# secret a later commit removed; the pre-commit hook is the prevention, this
# job is the backstop, and a pushed secret must be revoked.
# Never interruptible: a branch pipeline scans only its own pushed commits,
# so cancelling it would leave them unscanned.
secret-scan:
  stage: check
  interruptible: false
  image: alpine:3.20 # CONFIGURE: pin by digest (@sha256:...) once chosen
  variables:
    GIT_DEPTH: "0"
    VERSION: "1.9.0"
    # From checksums.txt of the release; bump both together.
    SHA256: "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7"
  before_script:
    - apk add --no-cache git curl
    - curl -sSfL "https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}/betterleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/betterleaks.tar.gz
    - echo "${SHA256}  /tmp/betterleaks.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/betterleaks.tar.gz -C /usr/local/bin betterleaks
  # A merge request scans from its diff base. A branch pipeline scans the
  # pushed commits; a new branch (all-zero before SHA) or a vanished base
  # scans the whole history.
  script:
    - |
      set -eu
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
      if echo "$base" | grep -Eq '^0+$' || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
        echo "No usable previous commit; scanning the whole history."
        betterleaks git . --no-banner --redact
      else
        betterleaks git . --no-banner --redact --log-opts="${base}..HEAD"
      fi
    - mkdir -p .gate && touch ".gate/$CI_JOB_NAME.ok"
  artifacts:
    paths: [.gate/]
    when: on_success
    expire_in: 1 day
